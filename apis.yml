name: BrainTripping
description: >-
  BrainTripping is a whimsical Markov-chain language game founded by Matthew
  Huebert in the Y Combinator Summer 2012 batch. It lets players step inside the
  vocabularies of famous historical and modern figures and compose their own
  sentences, constrained to that person's word patterns. The company is no
  longer active as a startup; today the BrainTripping GitHub organization
  publishes open-source ClojureScript tooling such as cljs-live, magic-tree, and
  the Lark editor. The public surface is a single-page ClojureScript web app at
  braintripping.com and it exposes no public REST API, SDK, or developer
  platform.
